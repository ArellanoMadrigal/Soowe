name: appdesarrollo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  community_charts_flutter: ^1.0.0  # Reemplazado charts_flutter por la versión de la comunidad
  dio: ^5.4.1
  http_parser: ^4.0.2
  path: ^1.8.0
  logger: ^2.0.2+1
  badges: ^3.1.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0  # Mantenemos la versión actual de intl
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  permission_handler: ^11.4.0
  flutter_localizations:
    sdk: flutter
  google_maps_flutter: ^2.1.1
  location: ^8.0.0
  geocoding: ^3.0.0
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  geolocator: ^13.0.2

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"  # Ruta del logo (512x512 recomendado)
  adaptive_icon_background: "#FFFFFF"  # Color de fondo para íconos adaptativos (Android)
  adaptive_icon_foreground: "assets/icon.png"  # Ícono en primer plano (Android)
